name: E2E

on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public values — the same ones shipped in the client bundle in
      # production. No secrets required for this workflow.
      NEXT_PUBLIC_SUPABASE_URL: https://fsifshgsmteicjdyrced.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Z9USvGwTNUmLuFqoj-ZQRw_bNc9N1JG
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 순수 로직 단위 테스트(DB 불필요, 1초 내외)를 먼저 돌려 빠르게 실패시킨다
      - run: npm run test:unit

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
